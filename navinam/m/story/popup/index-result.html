<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>나비남프로젝트 - 강명 감독</title>
  <link rel="stylesheet" href="css/style-flex-2.css">
  <link rel="stylesheet" href="css/jquery.bxslider.css">
  <script src="js/jquery-2.2.4.min.js"></script>
  <script src="js/jquery.bxslider.js"></script>

  <script>
    $(function() {
			var trigger = $('#trigger');
			var menu = $('nav ul');
			$(trigger).on('click', function (e) {
				e.preventDefault();
				menu.slideToggle();
			});

      $('.bxslider').bxSlider({
        auto:true,
        autoHover: true,
      });
    });
  </script>
</head>
<body>

  <!-- 내비게이션 -->
  <nav>
    <ul>
      <li><a href="#">처음으로</a></li>
      <li><a href="#">코딩이란</a></li>
      <li><a href="#">왜 코딩 교육인가</a></li>
      <li><a href="#">교육 프로그램</a></li>
    </ul>
    <a href="#" id="trigger">MENU</a>
  </nav>


  <!-- 헤더 -->
  <section>
    <div class="wrapper">
      <div class="banner">
        <div class="bxslider">
          <div><img src="images/top-1.jpg"></div>
          <div><img src="images/top-2.jpg"></div>
          <div><img src="images/top-3.jpg"></div>
        </div>
      </div>
    </div>
  </section>




</body>
</html>
